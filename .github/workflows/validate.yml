name: Validate

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  addon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: frenck/action-addon-linter@v2
        with:
          path: ./vector

  bridge:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vector/bridge
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: vector/bridge/go.mod
      - run: go vet ./...
      - run: go test ./...
