name: Vector (Anki / Digital Dream Labs)
version: "0.5.1"
slug: vector
description: Bridge for the Anki Vector robot (with a wire-pod server) with a WebSocket API for the Vector integration.
url: https://github.com/witold-gren/home-assistant-vector-addon
arch:
  - amd64
  - aarch64
startup: services
hassio_api: true
# read only: the weather entity for programs (weather command)
homeassistant_api: true
discovery:
  - vector
ports:
  3012/tcp: null
  8790/tcp: 8790
ports_description:
  3012/tcp: WebSocket API (by default only inside the HA network; publish it for Robots Code Studio)
  8790/tcp: Hook for wire-pod (voice → Home Assistant, with a token)
options:
  log_level: info
  wirepod_url: http://escapepod.local:8080
  esn: ""
  name: Vector
  robot_ip: ""
  guid: ""
  voice_router: true
  hook_host: ""
  live_stream: true
  stream_audio: false
  mic_sample_rate: 12000
  studio_token: ""
  studio_parent_token: ""
  piper_url: ""
  piper_voice: ""
  ai_url: ""
  ai_model: ""
  weather_entity: ""
  program_stay_still: true
  stay_still_timeout_min: 60
schema:
  log_level: list(debug|info|warn|error)
  wirepod_url: str
  esn: str
  name: str
  robot_ip: str
  guid: password
  voice_router: bool
  hook_host: str
  live_stream: bool
  stream_audio: bool
  mic_sample_rate: int(8000,48000)
  studio_token: password
  studio_parent_token: password
  piper_url: str
  piper_voice: str
  ai_url: str
  ai_model: str
  weather_entity: str
  program_stay_still: bool
  stay_still_timeout_min: int(1,480)
