name: Vector (Anki / Digital Dream Labs)
version: "0.2.0"
slug: vector
description: Bridge for the Anki Vector robot (with a wire-pod server) with a WebSocket API for the Vector integration.
url: https://github.com/witold-gren/home-assistant-vector-addon
arch:
  - amd64
  - aarch64
# tini as PID 1: forwards SIGTERM to the bridge and reaps go2rtc/ffmpeg child processes
init: true
startup: services
hassio_api: true
discovery:
  - vector
ports:
  3012/tcp: null
  8790/tcp: 8790
ports_description:
  3012/tcp: WebSocket API (by default only inside the HA network)
  8790/tcp: Hook for wire-pod (voice → Home Assistant, with a token)
options:
  log_level: info
  wirepod_url: http://escapepod.local:8080
  esn: ""
  name: Vector
  robot_ip: ""
  guid: ""
  voice_router: true
  hook_host: ""
  live_stream: true
  stream_audio: true
  mic_sample_rate: 16000
schema:
  log_level: list(debug|info|warn|error)
  wirepod_url: str
  esn: str
  name: str
  robot_ip: str
  guid: password
  voice_router: bool
  hook_host: str
  live_stream: bool
  stream_audio: bool
  mic_sample_rate: int(8000,48000)
