configuration:
  log_level:
    name: Log level
    description: How much to log. debug shows every robot event (touch, faces, wake word).
  wirepod_url:
    name: wire-pod URL
    description: The wire-pod server the bridge reads the robot's IP and SDK key (GUID) from, e.g. http://192.168.1.20:8080.
  esn:
    name: Robot serial (ESN)
    description: Empty = the first robot in wire-pod.
  name:
    name: Name
    description: Robot name in Home Assistant.
  robot_ip:
    name: Robot IP
    description: Overrides the address from wire-pod (normally empty).
  guid:
    name: GUID (SDK key)
    description: Overrides the key from wire-pod (normally empty).
  voice_router:
    name: Voice → Home Assistant
    description: Default for the voice router (wire-pod passes what Vector heard to HA first). Can be switched in HA; the switch is remembered.
  hook_host:
    name: Hook host
    description: Address wire-pod uses to reach this app (empty = the HA host IP).
  live_stream:
    name: Live stream
    description: Real video (WebRTC in Home Assistant) instead of camera snapshots. The camera only runs while somebody watches.
  stream_audio:
    name: Microphone in the stream
    description: Off by default. Vector's firmware does not send its microphone to the SDK — the audio feed is a 1 kHz test tone (beeps). Only for experiments.
  mic_sample_rate:
    name: Microphone sample rate
    description: Normally 12000 (what Vector's microphone feed measures). If the sound plays too fast or too slow, use the value the log shows as "microphone feed … sample_rate_hz".
  studio_token:
    name: Studio token
    description: Password for Robots Code Studio (children's block / Python programs). The studio may only run programs (motion, speech, animations, cube) and read the sensors — no settings, faces, photos or camera. Empty = studio connections are refused. Also publish port 3012 below.
network:
  3012/tcp: WebSocket API (by default only inside the HA network; publish it for Robots Code Studio)
  8790/tcp: Hook for wire-pod (voice → Home Assistant, with a token)
